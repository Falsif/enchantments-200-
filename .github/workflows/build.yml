name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Resolve latest Fabric Loader / Fabric API for 1.21.1
        run: |
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version' || true)
          FAPI=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oP '<version>\K[^<]*\+1\.21\.1(?=</version>)' | tail -1 || true)
          PROPS=""
          [ -n "$LOADER" ] && PROPS="$PROPS -Ploader_version=$LOADER"
          [ -n "$FAPI" ] && PROPS="$PROPS -Pfabric_version=$FAPI"
          echo "Loader=$LOADER FabricAPI=$FAPI"
          echo "PROPS=$PROPS" >> "$GITHUB_ENV"

      - name: Build jar
        run: gradle build --no-daemon --stacktrace $PROPS

      - name: Self test on a real 1.21.1 server
        run: |
          mkdir -p run-test
          echo "eula=true" > run-test/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\nview-distance=3\nsimulation-distance=3\n' > run-test/server.properties
          timeout 1500 gradle runSelftest --no-daemon $PROPS > selftest-console.log 2>&1 || true
          tail -n 60 selftest-console.log
          echo "================ REPORT ================"
          cat run-test/selftest-report.txt || echo "NO REPORT (server crashed?)"
          grep -q "^RESULT: PASSED" run-test/selftest-report.txt

      - name: Upload jar and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enchantments200
          path: |
            build/libs/*.jar
            run-test/selftest-report.txt
            selftest-console.log
            run-test/logs/latest.log

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          TAG="v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" "$JAR" run-test/selftest-report.txt \
            --title "Enchantments 200 for Fabric 1.21.1 (build ${{ github.run_number }})" \
            --notes "Self test passed on a real Minecraft 1.21.1 server. Put the .jar into .minecraft/mods together with Fabric API."
